<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="/manifest.json"/>
<title>KRYPT</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════
   KRYPT — Complete Design System
══════════════════════════════════════════ */
:root{
  --bg:#080b10;--bg2:#0c1018;--sur:#10141e;--sur2:#161c28;
  --bdr:#1a2232;--bdr2:#22304a;
  --blue:#00aaff;--blue2:#40c8ff;--bluedim:rgba(0,170,255,0.12);--blueglow:rgba(0,170,255,0.35);
  --green:#00ee7a;--greendim:rgba(0,238,122,0.12);
  --red:#e83030;--reddim:rgba(232,48,48,0.13);
  --amber:#ffaa00;--amberdim:rgba(255,170,0,0.12);
  --purple:#aa44ff;--purpledim:rgba(170,68,255,0.12);
  --text:#b8cce0;--textd:#3a5570;--textb:#eaf0ff;
  --me-bg:#0088dd;--me-fg:#fff;
  --them-bg:#161c28;--them-fg:#b8cce0;
  --overlay:rgba(0,0,0,0.88);
  --mono:'Share Tech Mono',monospace;
  --ui:'Exo 2',system-ui,sans-serif;
  --r:14px;--rs:9px;--rxl:20px;
}
[data-theme=day]{
  --bg:#f0f4ff;--bg2:#e6ecff;--sur:#fff;--sur2:#eef2ff;
  --bdr:#ccd4ee;--bdr2:#b0bce0;
  --blue:#0055cc;--blue2:#0077ee;--bluedim:rgba(0,85,204,0.1);--blueglow:rgba(0,85,204,0.3);
  --green:#007a38;--greendim:rgba(0,122,56,0.1);
  --red:#cc2222;--reddim:rgba(204,34,34,0.1);
  --amber:#996600;--amberdim:rgba(153,102,0,0.1);
  --text:#1a2448;--textd:#8090b8;--textb:#0a1230;
  --me-bg:#0055cc;--me-fg:#fff;
  --them-bg:#e4eaff;--them-fg:#1a2448;
  --overlay:rgba(0,0,10,0.75);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{height:100%;font-family:var(--ui);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none;transition:background .3s,color .3s}
[data-theme=night] body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:900;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px)}

/* ── Utilities ── */
.view{display:flex;flex-direction:column;height:100vh;height:100dvh}
.view.hidden{display:none!important}
.kw{font-family:var(--ui);font-weight:900;letter-spacing:.16em;color:var(--blue);text-shadow:0 0 20px var(--blueglow)}
.kw.lg{font-size:36px}.kw.md{font-size:22px}.kw.sm{font-size:17px}
.mono{font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;border:1px solid transparent;transition:all .3s}
.dot{width:7px;height:7px;border-radius:50%}
@keyframes gp{0%,100%{opacity:1}50%{opacity:.3}}
.pill.idle{border-color:var(--bdr);color:var(--textd)}.pill.idle .dot{background:var(--textd)}
.pill.ready{border-color:var(--bluedim);color:var(--textd)}.pill.ready .dot{background:var(--textd)}
.pill.link{border-color:rgba(255,170,0,.3);color:var(--amber)}.pill.link .dot{background:var(--amber);animation:gp 1s infinite}
.pill.on{border-color:rgba(0,238,122,.3);color:var(--green)}.pill.on .dot{background:var(--green);animation:gp 2s infinite}
.pill.err{border-color:rgba(232,48,48,.3);color:var(--red)}.pill.err .dot{background:var(--red)}

/* ── Inputs ── */
input[type=text],input[type=search],textarea{width:100%;font-family:var(--mono);font-size:13px;background:var(--bg2);color:var(--textb);border:1px solid var(--bdr);border-radius:var(--rs);padding:11px 13px;outline:none;-webkit-appearance:none;transition:border-color .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:var(--textd)}
input:focus,textarea:focus{border-color:rgba(0,170,255,.45);box-shadow:0 0 0 3px var(--bluedim)}
input:disabled,textarea:disabled{opacity:.4;cursor:not-allowed}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--ui);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;border-radius:var(--rs);border:1px solid transparent;cursor:pointer;transition:all .15s;white-space:nowrap;-webkit-appearance:none}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.96);opacity:.8}
.btn-blue{background:var(--bluedim);color:var(--blue);border-color:rgba(0,170,255,.3)}
.btn-blue:not(:disabled):hover{background:rgba(0,170,255,.2)}
.btn-ghost{background:transparent;color:var(--textd);border-color:var(--bdr)}
.btn-ghost:not(:disabled):hover{background:var(--sur2);color:var(--text)}
.btn-red{background:var(--reddim);color:var(--red);border-color:rgba(232,48,48,.3)}
.btn-red:not(:disabled):hover{background:rgba(232,48,48,.22)}
.btn-green{background:var(--greendim);color:var(--green);border-color:rgba(0,238,122,.3)}
.btn-green:not(:disabled):hover{background:rgba(0,238,122,.2)}
.btn-icon{padding:10px;flex-shrink:0}
.btn-icon-sm{padding:7px;flex-shrink:0}
.rnd{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;transition:all .2s;flex-shrink:0}
.rnd:active{transform:scale(.92)}
.rnd.gr{background:#00b85a;color:#fff;box-shadow:0 4px 20px rgba(0,184,90,.45)}
.rnd.rd{background:#e83030;color:#fff;box-shadow:0 4px 20px rgba(232,48,48,.45)}
.rnd.bl{background:#0088ee;color:#fff;box-shadow:0 4px 20px rgba(0,136,238,.35)}
.rnd.gy{background:#1e2a3a;color:var(--text)}
.rnd.tog{background:var(--blue);color:#fff}

/* ── Cards ── */
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;transition:background .3s,border-color .3s}
.card-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--textd);margin-bottom:10px}
.divider{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;color:var(--textd);letter-spacing:.1em;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--bdr)}
.err{font-family:var(--mono);font-size:11px;color:var(--red);margin-top:8px}

/* ════════════════════════════════════════
   SPLASH
════════════════════════════════════════ */
#splash{position:fixed;inset:0;z-index:9000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;animation:sIn .5s ease-out}
@keyframes sIn{from{opacity:0}to{opacity:1}}
#splash.hide{animation:sOut .5s ease-in forwards}
@keyframes sOut{from{opacity:1}to{opacity:0}}
.sp-logo{animation:logoUp .9s cubic-bezier(.34,1.56,.64,1) .2s both}
@keyframes logoUp{from{transform:scale(.65) translateY(24px);opacity:0}to{transform:scale(1);opacity:1}}
.sp-sl{font-family:var(--ui);font-weight:300;font-size:17px;letter-spacing:.05em;color:rgba(255,255,255,.7);text-align:center;animation:slIn .7s ease-out .8s both}
@keyframes slIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sp-sl b{color:#44bbff;font-weight:400}
.sp-bar{width:120px;height:2px;background:#0a1a2a;border-radius:1px;overflow:hidden;animation:slIn .7s ease-out 1s both}
.sp-bar-fill{height:100%;background:linear-gradient(90deg,#00aaff,#00ddff);animation:barFill 3s linear 1s both}
@keyframes barFill{from{width:0}to{width:100%}}

/* ════════════════════════════════════════
   SETUP
════════════════════════════════════════ */
#setupView{overflow-y:auto}
.setup-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px 24px;text-align:center;gap:10px;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(0,140,255,.08) 0%,transparent 70%)}
.setup-tag{font-family:var(--mono);font-size:11px;color:var(--textd);letter-spacing:.12em}
.setup-body{flex:1;padding:10px 18px 40px;display:flex;flex-direction:column;gap:13px;max-width:500px;width:100%;margin:0 auto}
.id-row{display:flex;gap:8px;align-items:stretch}
.id-box{flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:var(--blue);background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rs);padding:11px 13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:all;text-shadow:0 0 10px var(--blueglow);transition:all .3s}
.cr{display:flex;gap:8px;margin-top:10px}
.cr input{flex:1;min-width:0}
.srow{display:flex;justify-content:center;align-items:center;gap:10px}
.sf{text-align:center;font-family:var(--mono);font-size:10px;color:var(--textd);letter-spacing:.07em;line-height:1.9}
.sf i{color:var(--blue);opacity:.5;font-style:normal}

/* ════════════════════════════════════════
   CHAT HEADER
════════════════════════════════════════ */
.chat-hdr{background:var(--sur);border-bottom:1px solid var(--bdr);padding:10px 12px;flex-shrink:0;position:relative;transition:background .3s}
.chat-hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--blueglow),transparent);opacity:.5}
.chat-hdr-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chat-meta{flex:1;min-width:0}
.chat-sub{font-family:var(--mono);font-size:10px;color:var(--textd);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.chat-pid{font-family:var(--mono);font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-acts{display:flex;gap:5px;align-items:center;flex-shrink:0}

/* ════════════════════════════════════════
   MESSAGES
════════════════════════════════════════ */
#messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;background:var(--bg)}
.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px 20px}
.empty-hint{font-family:var(--mono);font-size:11px;color:var(--textd);letter-spacing:.1em}
.msg-row{display:flex;flex-direction:column}
.msg-row.me{align-items:flex-end}.msg-row.them{align-items:flex-start}
.slbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--textd);text-transform:uppercase;margin-bottom:3px}
.msg-row.me .slbl{color:rgba(0,170,255,.5)}
.bubble{max-width:82%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.55;word-wrap:break-word;white-space:pre-wrap}
.bubble.me{background:var(--me-bg);color:var(--me-fg);border-bottom-right-radius:4px;box-shadow:0 2px 16px rgba(0,100,200,.28)}
.bubble.them{background:var(--them-bg);color:var(--them-fg);border:1px solid var(--bdr);border-bottom-left-radius:4px}
.btime{display:block;font-family:var(--mono);font-size:9px;margin-top:4px;opacity:.5;text-align:right;letter-spacing:.04em}
.bubble.them .btime{text-align:left}
.sys-msg{text-align:center;font-family:var(--mono);font-size:10px;color:var(--textd);padding:3px 12px;background:var(--sur);border:1px solid var(--bdr);border-radius:999px;align-self:center;letter-spacing:.06em}

/* media bubble */
.media-bubble{max-width:82%;border-radius:14px;overflow:hidden;border:1px solid var(--bdr);cursor:pointer;position:relative}
.media-bubble.me{border-color:rgba(0,136,221,.4)}
.media-bubble img,.media-bubble video{width:100%;max-width:260px;display:block;border-radius:13px}
.media-bubble .media-meta{font-family:var(--mono);font-size:10px;color:var(--textd);padding:6px 10px;background:var(--sur);display:flex;align-items:center;gap:6px}
.media-bubble.me .media-meta{background:rgba(0,80,160,.3);color:rgba(255,255,255,.6)}

/* voice bubble */
.voice-bubble{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;border:1px solid var(--bdr);min-width:180px;max-width:82%}
.voice-bubble.me{background:var(--me-bg);border-color:rgba(0,136,221,.4)}
.voice-bubble.them{background:var(--them-bg)}
.voice-play{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;flex-shrink:0;transition:all .2s}
.voice-play:hover{background:rgba(255,255,255,.3)}
.voice-wave{flex:1;height:24px;display:flex;align-items:center;gap:2px}
.voice-wave span{display:inline-block;width:3px;border-radius:2px;background:rgba(255,255,255,.5);animation:wv 0.8s ease-in-out infinite alternate}
.voice-wave span:nth-child(odd){animation-delay:.1s}
.voice-wave span:nth-child(3n){animation-delay:.2s}
.voice-bubble.them .voice-wave span{background:var(--blue);opacity:.6}
@keyframes wv{from{height:4px}to{height:20px}}
.vdur{font-family:var(--mono);font-size:10px;opacity:.6;flex-shrink:0}

/* ════════════════════════════════════════
   INPUT BAR
════════════════════════════════════════ */
.input-bar{background:var(--sur);border-top:1px solid var(--bdr);padding:8px 10px;flex-shrink:0;transition:background .3s;position:relative}
.input-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--blueglow),transparent);opacity:.4}
.input-main{display:flex;gap:7px;align-items:flex-end}
.input-wrap{flex:1;min-width:0;position:relative}
.input-wrap textarea{border-radius:20px;padding:10px 42px 10px 14px;resize:none;max-height:100px;overflow-y:auto;font-size:14px;line-height:1.4;background:var(--bg2)}
.attach-btn{position:absolute;right:10px;bottom:9px;background:none;border:none;cursor:pointer;color:var(--textd);padding:4px;transition:color .15s}
.attach-btn:hover{color:var(--blue)}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;box-shadow:0 2px 12px var(--blueglow)}
.send-btn:disabled{opacity:.3;cursor:not-allowed}
.send-btn:active:not(:disabled){transform:scale(.92)}
.mic-btn{width:42px;height:42px;border-radius:50%;background:var(--sur2);color:var(--textd);border:1px solid var(--bdr);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.mic-btn.recording{background:var(--red);color:#fff;border-color:transparent;box-shadow:0 0 0 4px rgba(232,48,48,.2);animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 4px rgba(232,48,48,.2)}50%{box-shadow:0 0 0 8px rgba(232,48,48,.1)}}
.toolbar{display:flex;gap:4px;padding:6px 2px 2px;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tool-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:5px 10px;border-radius:8px;transition:background .15s;flex-shrink:0}
.tool-btn:hover{background:var(--sur2)}
.tool-btn svg{color:var(--textd)}
.tool-btn span{font-family:var(--mono);font-size:9px;color:var(--textd);letter-spacing:.05em}
.enc-note{text-align:center;font-family:var(--mono);font-size:10px;color:var(--textd);letter-spacing:.06em;margin-top:5px;padding-top:5px;border-top:1px solid var(--bdr)}

/* ════════════════════════════════════════
   ATTACHMENT PREVIEW
════════════════════════════════════════ */
#attachPreview{display:none;padding:8px 10px;background:var(--sur2);border-top:1px solid var(--bdr);gap:8px;align-items:center}
#attachPreview.show{display:flex}
.att-thumb{width:50px;height:50px;border-radius:8px;object-fit:cover;background:var(--bdr)}
.att-info{flex:1;min-width:0}
.att-name{font-family:var(--mono);font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-size{font-family:var(--mono);font-size:10px;color:var(--textd);margin-top:2px}
.att-clear{background:none;border:none;cursor:pointer;color:var(--textd);padding:4px}

/* ════════════════════════════════════════
   NUKE BAR
════════════════════════════════════════ */
#nukeBar{display:none;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:rgba(232,48,48,.08);border:1px solid rgba(232,48,48,.2);border-radius:var(--rs);margin:0 10px 6px}
#nukeBar.open{display:flex}
.nw{font-family:var(--mono);font-size:11px;color:var(--red)}
.nb{display:flex;gap:6px}

/* ════════════════════════════════════════
   CALL OVERLAYS
════════════════════════════════════════ */
.call-ov{display:none;position:fixed;inset:0;z-index:2000;background:var(--overlay);backdrop-filter:blur(10px);flex-direction:column;align-items:center;justify-content:center;gap:24px}
.call-ov.open{display:flex}
.call-av{width:86px;height:86px;border-radius:50%;background:var(--sur2);border:3px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:34px;animation:avPulse 1.8s infinite}
@keyframes avPulse{0%,100%{box-shadow:0 0 0 8px rgba(0,170,255,.1)}50%{box-shadow:0 0 0 16px rgba(0,170,255,.05)}}
.call-type{font-family:var(--mono);font-size:10px;color:var(--textd);letter-spacing:.14em;text-transform:uppercase}
.call-title{font-family:var(--ui);font-weight:800;font-size:20px;color:var(--textb)}
.call-sub{font-family:var(--mono);font-size:12px;color:var(--textd)}
.call-acts{display:flex;gap:28px;align-items:center}
.call-lbl{text-align:center;font-family:var(--mono);font-size:10px;color:var(--textd);margin-top:6px;letter-spacing:.06em}
.calling-dots{display:flex;gap:8px}
.calling-dots s{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);animation:db 1.2s infinite;text-decoration:none}
.calling-dots s:nth-child(2){animation-delay:.2s}.calling-dots s:nth-child(3){animation-delay:.4s}
@keyframes db{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ════════════════════════════════════════
   ACTIVE CALL SCREEN
════════════════════════════════════════ */
#callScreen{display:none;position:fixed;inset:0;z-index:1500;background:#000;flex-direction:column}
#callScreen.open{display:flex}
.vid-wrap{flex:1;position:relative;background:#000;overflow:hidden}
#remoteVideo{width:100%;height:100%;object-fit:cover;background:#000}
#localVideo{position:absolute;bottom:14px;right:14px;width:90px;height:126px;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.25);background:#111;z-index:10}
.voice-disp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(0,120,220,.08) 0%,transparent 70%)}
.voice-av{width:96px;height:96px;border-radius:50%;background:var(--sur2);border:3px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 0 0 10px rgba(0,170,255,.07)}
.call-dur{font-family:var(--mono);font-size:26px;color:var(--textb);letter-spacing:.12em}
.call-sname{font-family:var(--ui);font-weight:700;font-size:18px;color:var(--textb)}
.call-stat{font-family:var(--mono);font-size:11px;color:var(--textd);letter-spacing:.1em}
.call-ctrls{background:rgba(0,0,0,.85);backdrop-filter:blur(12px);padding:20px 20px 36px;display:flex;align-items:center;justify-content:center;gap:18px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
.ctrl-g{display:flex;flex-direction:column;align-items:center;gap:6px}
.ctrl-lbl{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.07em}

/* ════════════════════════════════════════
   MEDIA LIGHTBOX
════════════════════════════════════════ */
#lightbox{display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.95);flex-direction:column;align-items:center;justify-content:center}
#lightbox.open{display:flex}
#lightbox img,#lightbox video{max-width:100%;max-height:8
